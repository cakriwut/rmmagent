name: Build & Release Agent

on:
  push:
    branches: [develop]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version override (e.g. 2.10.0). Leave empty to use main.go default."
        required: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build all platforms
        run: |
          mkdir -p dist

          # Determine version: tag > workflow_dispatch input > main.go default (no override)
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION="${{ github.ref_name }}"
            VERSION="${VERSION#v}"
          elif [[ -n "${{ github.event.inputs.version }}" ]]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            # Use hardcoded version in main.go -- don't override with commit hash
            VERSION=""
          fi

          if [ -n "$VERSION" ]; then
            LDFLAGS="-s -w -X main.version=${VERSION}"
          else
            LDFLAGS="-s -w"
          fi

          echo "Building with VERSION=${VERSION:-'(from main.go)'} LDFLAGS=$LDFLAGS"

          platforms=(
            "linux/amd64"
            "linux/386"
            "linux/arm64"
            "linux/arm"
            "windows/amd64"
            "windows/386"
            "darwin/amd64"
            "darwin/arm64"
          )

          for platform in "${platforms[@]}"; do
            OS="${platform%/*}"
            ARCH="${platform#*/}"
            OUT="dist/tacticalagent-${OS}-${ARCH}"
            [ "$OS" = "windows" ] && OUT="${OUT}.exe"
            echo "Building $OUT..."
            CGO_ENABLED=0 GOOS=$OS GOARCH=$ARCH go build -ldflags "$LDFLAGS" -o "$OUT" .
          done
          ls -lh dist/

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: agents
          path: dist/
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
